<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Sistema de Cadastro do Cidadão</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --azul-sus: #1451B4;
    --azul-sus-escuro: #0B3B87;
    --azul-claro: #EAF1FC;
    --azul-borda: #CFE0F7;
    --texto: #1C2733;
    --texto-suave: #5B6B7C;
    --branco: #FFFFFF;
    --cinza-bg: #F7F9FC;
    --vermelho: #C5221F;
    --sombra: 0 1px 3px rgba(20,81,180,0.08), 0 1px 2px rgba(20,81,180,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    background:var(--cinza-bg);
    color:var(--texto);
    padding:20px;
  }
  .login-card{
    background:var(--branco);
    border:1px solid var(--azul-borda);
    border-radius:12px;
    box-shadow:0 10px 30px rgba(10,30,70,.12);
    width:100%;
    max-width:380px;
    padding:32px 28px 28px;
    text-align:center;
  }
  .login-card img{height:52px;display:block;margin:0 auto 14px;}
  .login-card h1{font-size:17px;margin:0 0 2px;color:var(--azul-sus-escuro);font-weight:600;}
  .login-card p.subtitulo{margin:0 0 26px;font-size:12.5px;color:var(--texto-suave);}
  form{text-align:left;display:flex;flex-direction:column;gap:14px;}
  label{font-size:12.5px;font-weight:600;color:var(--texto-suave);margin-bottom:5px;display:block;}
  input[type=text], input[type=password]{
    width:100%;
    border:1px solid var(--azul-borda);
    border-radius:6px;
    padding:10px 11px;
    font-size:14px;
    font-family:inherit;
    color:var(--texto);
    background:var(--branco);
  }
  input:focus{outline:2px solid var(--azul-sus);outline-offset:1px;}
  button{
    border:none;
    border-radius:6px;
    padding:11px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    background:var(--azul-sus);
    color:var(--branco);
    margin-top:4px;
  }
  button:hover{background:var(--azul-sus-escuro);}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .erro{
    font-size:12.5px;
    color:var(--vermelho);
    min-height:16px;
    margin:2px 0 0;
  }
  footer{margin-top:22px;font-size:11px;color:var(--texto-suave);}
</style>
</head>

    <h1>Sistema de Cadastro do Cidadão</h1>
    <p class="subtitulo">Unidade Básica de Saúde — Sistema Único de Saúde (SUS)</p>

    <form id="formLogin" autocomplete="off">
      <div>
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" autocomplete="username" required autofocus>
      </div>
      <div>
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" required>
      </div>
      <p class="erro" id="erroLogin"></p>
      <button type="submit" id="btnEntrar">Entrar</button>
    </form>

    <footer>Desenvolvido por Lucas Mateus Salviano</footer>
  </div>

<script>
(function(){
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function usuarioParaEmail(usuario){
    const limpo = (usuario || '').trim().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9._-]/g, '');
    return limpo + DOMINIO_USUARIO;
  }

  // Se já existe sessão válida, pula direto para o sistema
  supabase.auth.getSession().then(({ data })=>{
    if(data.session) window.location.href = 'sistema-cidadao.html';
  });

  const form = document.getElementById('formLogin');
  const erro = document.getElementById('erroLogin');
  const botao = document.getElementById('btnEntrar');

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    erro.textContent = '';
    botao.disabled = true;
    botao.textContent = 'Entrando...';

    const usuario = document.getElementById('usuario').value;
    const senha = document.getElementById('senha').value;
    const email = usuarioParaEmail(usuario);

    const { error } = await supabase.auth.signInWithPassword({ email, password: senha });

    botao.disabled = false;
    botao.textContent = 'Entrar';

    if(error){
      erro.textContent = 'Usuário ou senha inválidos.';
      return;
    }
    window.location.href = 'sistema-cidadao.html';
  });
})();
</script>
